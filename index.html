<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video upload</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--page:#e9eeed;--ink:#12303b;--muted:#4a6670;--card:#ffffff;--line:#c5d2d1;--accent:#f2b134;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--page:#0b1519;--ink:#e4eeee;--muted:#8fa9ae;--card:#12303b;--line:#24505f;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;line-height:1.5}
main{max-width:880px;margin:0 auto;padding:48px 20px 64px}
h1{font-size:clamp(34px,7vw,60px);line-height:1.05;margin:0 0 .3em;font-weight:800;letter-spacing:-.025em}
.lead{color:var(--muted);font-size:clamp(15px,2.4vw,19px);margin:0 0 2.2em;max-width:36em}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:8px;padding:18px 18px 16px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--ink);border-left-color:var(--accent)}
a.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card h2{font-size:19px;line-height:1.3;margin:0 0 .35em;font-weight:600}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .path{margin-top:.8em;font-size:12px;color:var(--muted);opacity:.85}
.msg{color:var(--muted);padding:20px;border:1px dashed var(--line);border-radius:8px}
</style>
</head>
<body>
<main>
  <h1>Video upload</h1>
  <p class="lead">Các video tự tải lên do Lemon làm. Chọn 1 video để biết thêm chi tiết.</p>
  <div id="list" class="list" aria-live="polite"></div>
</main>
<script>
(function(){
  var box=document.getElementById("list");
  var SKIP=/^(\.|_|assets$|node_modules$|images?$|css$|js$)/i;

  function say(t){box.className="";box.innerHTML="";var d=document.createElement("div");d.className="msg";d.textContent=t;box.appendChild(d)}

  function repoInfo(){
    var h=location.hostname,p=location.pathname.split("/").filter(Boolean);
    if(!/\.github\.io$/.test(h))return null;
    var repo=(p.length&&!/\.html?$/i.test(p[0]))?p[0]:h;
    return {owner:h.split(".")[0],repo:repo};
  }

  function folders(){
    var info=repoInfo();
    var viaApi=info?fetch("https://api.github.com/repos/"+info.owner+"/"+info.repo+"/contents/")
      .then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(a){return a.filter(function(x){return x.type==="dir"&&!SKIP.test(x.name)}).map(function(x){return x.name})}):Promise.reject();
    return viaApi.catch(function(){
      // Phương án dự phòng: file videos.json chứa mảng tên thư mục, ví dụ ["ransomware","phishing"]
      return fetch("videos.json").then(function(r){if(!r.ok)throw 0;return r.json()});
    });
  }

  function meta(name){
    return fetch(name+"/index.html").then(function(r){
      if(!r.ok)return null;
      return r.text().then(function(t){
        var d=new DOMParser().parseFromString(t,"text/html");
        var m=d.querySelector('meta[name="description"]');
        return {folder:name,title:(d.title||name).trim(),desc:m?m.getAttribute("content"):""};
      });
    }).catch(function(){return null});
  }

  function render(items){
    if(!items.length){say("Chưa có video nào. Hãy thêm một thư mục có file index.html bên trong.");return}
    items.sort(function(a,b){return a.title.localeCompare(b.title,"vi")});
    box.className="list";box.innerHTML="";
    items.forEach(function(v){
      var a=document.createElement("a");a.className="card";a.href=v.folder+"/";
      var h=document.createElement("h2");h.textContent=v.title;a.appendChild(h);
      if(v.desc){var p=document.createElement("p");p.textContent=v.desc;a.appendChild(p)}
      var s=document.createElement("div");s.className="path";s.textContent="/"+v.folder+"/";a.appendChild(s);
      box.appendChild(a);
    });
  }

  say("Đang tải danh sách video...");
  var KEY="video-list-v1",cached=null;
  try{var c=JSON.parse(localStorage.getItem(KEY)||"null");if(c&&Date.now()-c.t<300000)cached=c.items}catch(e){}
  if(cached){render(cached);return}

  folders().then(function(names){
    return Promise.all(names.map(meta));
  }).then(function(items){
    items=items.filter(Boolean);
    try{localStorage.setItem(KEY,JSON.stringify({t:Date.now(),items:items}))}catch(e){}
    render(items);
  }).catch(function(){
    say("Không tải được danh sách. Nếu bạn đang mở file trên máy thì đây là bình thường, hãy mở bản trên GitHub Pages. Hoặc tạo file videos.json chứa danh sách tên thư mục.");
  });
})();
</script>
</body>
</html>
